[package]
name = "miniforge"
version = "0.7.0"
edition = "2024"

[lib]
name = "miniforge"
path = "src/lib.rs"

[[bin]]
name = "miniforge"
path = "src/main.rs"

[[bin]]
name = "miniforge_editor"
path = "src/bin/miniforge_editor.rs"

[[bin]]
name = "miniforge_runtime"
path = "src/bin/miniforge_runtime.rs"

[dependencies]
macroquad = "0.4"
pathfinding = "4.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
