[package]
name = "miniforge"
version = "0.9.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "MiniForge 2D game engine, runtime and editor"
default-run = "miniforge"
autobins = false

[features]
default = ["editor"]
runtime = []
editor_ffi = ["editor"]
editor = [
    "runtime",
    "dep:arboard",
    "dep:egui",
    "dep:egui_dock",
    "dep:egui_extras",
    "dep:egui-phosphor",
    "dep:nucleo-matcher",
    "dep:open",
    "dep:rfd",
    "dep:syntect",
    "dep:trash",
]

[lib]
name = "miniforge"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "miniforge"
path = "src/main.rs"
required-features = ["editor"]

[[bin]]
name = "miniforge_editor"
path = "src/bin/miniforge_editor.rs"
required-features = ["editor"]

[[bin]]
name = "miniforge_runtime"
path = "src/bin/miniforge_runtime.rs"
required-features = ["runtime"]

[[bin]]
name = "miniforge_headless"
path = "src/bin/miniforge_headless.rs"
required-features = ["runtime"]

[[bin]]
name = "miniforge_dev"
path = "src/bin/miniforge_dev.rs"
required-features = ["editor"]

[dependencies]
egui = { version = "0.34", optional = true }
egui_dock = { version = "0.19.1", optional = true }
egui_extras = { version = "0.34.2", optional = true }
guillotiere = "0.7"
image = "0.25.10"
kira = "0.10"
lyon = "1.0"
macroquad = "0.4"
notify = "8"
pathfinding = "4.15.0"
rayon = "1.10"
rapier2d = "0.32"
rstar = "0.13.0"
rfd = { version = "0.15", optional = true }
mlua = { version = "0.11.4", features = ["luau", "vendored"] }
libloading = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11.1"
sysinfo = "0.35"
walkdir = "2.5.0"
zip = "8.6.0"
egui-phosphor = { version = "0.12.0", features = ["regular", "fill"], optional = true }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"], optional = true }
arboard = { version = "3.6.1", optional = true }
open = { version = "5.3.5", optional = true }
trash = { version = "5.2.6", optional = true }
petgraph = "0.8.3"
nucleo-matcher = { version = "0.3.1", optional = true }
crossbeam-channel = "0.5.15"
resvg = "0.47.0"
usvg = "0.47.0"

[package.metadata.miniforge]
engine-version = "0.9.3.4"
release-name = "2D Workflow Foundations"

# Slow, compact profile reserved for distributable runtimes. Keeping this
# separate from `release` preserves a fast iteration loop for editor builds.
[profile.ship]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
